[project]
name = "openbeats"
version = "0.2.0"
description = "Inference + pretraining for the OpenBEATs audio encoder (vendored ESPnet BeatsEncoder)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Shikhar Bharadwaj" }]
keywords = ["audio", "beats", "openbeats", "embeddings", "bioacoustics", "espnet"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Lower bounds only: an existing torch/torchaudio install satisfies these, so pip
# won't reinstall and clobber a user's (e.g. CUDA-matched) build.
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy",
    "packaging",
    "pyyaml",
    "huggingface-hub",
    "soundfile",
]

[project.optional-dependencies]
# Only for checkpoints using the wav2vec2 conformer adapter / learned positional
# embeddings (not used by the standard OpenBEATs encoders).
adapter = ["transformers"]
# Stage A (tokenize & dump): the acoustic tokenizer (einops) + the Parquet token
# dataset (pyarrow). Keeps the default inference install light & ESPnet-free.
tokenize = ["pyarrow", "einops"]
# Stage B (pretrain): DeepSpeed loop + logging, on top of the tokenize deps.
# typeguard is needed by the verbatim-vendored BeatsPretrainModel (@typechecked).
train = ["deepspeed", "wandb", "pyarrow", "einops", "typeguard"]

[project.scripts]
openbeats-infer = "openbeats.inference.run_inference:infer_main"
openbeats-download = "openbeats.utils.hub:download_main"
openbeats-tokenize = "openbeats.tokenization.dump:tokenize_main"
openbeats-tokens = "openbeats.utils.tokens:tokens_main"
openbeats-train-encoder = "openbeats.train:train_encoder_main"
openbeats-convert = "openbeats.utils.convert:main"

[project.urls]
Homepage = "https://shikhar-s.github.io/OpenBEATs/"
Paper = "https://arxiv.org/abs/2507.14129"

[dependency-groups]
# Tokenize-stage deps (einops/pyarrow) are in dev so the offline unit tests for
# the vendored tokenizer/helpers and the Parquet schema run with `uv run pytest`.
dev = ["pytest", "einops", "pyarrow", "typeguard"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbeats"]
